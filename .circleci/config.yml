version: 2.1

# One image job runs the shared build command:
#   build-wifi-only  -> configs/wifi-only.diffconfig (Wi-Fi only)
#
# Resource class "large" is the biggest class on the current plan.
# Disk is the tight limit (100 GB). Each build sets:
#   - CONFIG_TARGET_ROOTFS_INITRAMFS=n (skips the initramfs image)
#   - CONFIG_AUTOREMOVE=y (removes each package's build_dir after install)
#
# grow_rootfs (default false): when false, CI images do not include the
# first-boot script that grows the root partition to fill the SD card,
# so the root partition stays at rootfs_partsize.

parameters:
  rootfs_partsize:
    type: string
    default: "800"
  grow_rootfs:
    type: boolean
    default: false

commands:
  build-image:
    parameters:
      seed:
        type: string
    steps:
      - checkout
      - run:
          name: Check free disk (need 85 GB)
          command: |
            df -h .
            avail=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
            echo "Free: ${avail} GB"
            [ "$avail" -ge 85 ] || { echo "Not enough disk"; exit 1; }
      - run:
          name: Install build dependencies
          command: |
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
              gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
              python3-pyelftools rsync swig unzip zlib1g-dev file wget zstd
      - run:
          name: Feeds
          command: |
            ./scripts/feeds update -a
            ./scripts/feeds install -a
      - unless:
          condition: << pipeline.parameters.grow_rootfs >>
          steps:
            - run:
                name: Disable first-boot rootfs grow
                command: rm -f files/etc/uci-defaults/05-grow-rootfs
      - run:
          name: Seed config
          command: |
            case "$PARTSIZE" in (*[!0-9]*|"") echo "Bad partsize: $PARTSIZE"; exit 1;; esac
            cp "<< parameters.seed >>" .config
            sed -i '/^CONFIG_TARGET_ROOTFS_PARTSIZE=/d; /^CONFIG_TARGET_ROOTFS_INITRAMFS/d; /^# CONFIG_TARGET_ROOTFS_INITRAMFS is not set/d; /CONFIG_AUTOREMOVE/d' .config
            {
              echo "CONFIG_TARGET_ROOTFS_PARTSIZE=$PARTSIZE"
              echo "# CONFIG_TARGET_ROOTFS_INITRAMFS is not set"
              echo "CONFIG_AUTOREMOVE=y"
            } >> .config
            grep -q "^CONFIG_TARGET_ROOTFS_PARTSIZE=$PARTSIZE$" .config || { echo "partsize not applied"; exit 1; }
            grep -q "^CONFIG_AUTOREMOVE=y" .config || { echo "autoremove not applied"; exit 1; }
            make defconfig
      - run:
          name: Build
          command: |
            set -o pipefail
            make -j"$(nproc)" download
            make -j"$(nproc)" V=s 2>&1 | tee build.log
      - run:
          name: Check disk after build
          when: always
          command: df -h .
      - store_artifacts:
          path: bin/targets/sunxi/cortexa55
          destination: image
      - store_artifacts:
          path: build.log

jobs:
  build-wifi-only:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      PARTSIZE: << pipeline.parameters.rootfs_partsize >>
    steps:
      - build-image:
          seed: configs/wifi-only.diffconfig

workflows:
  image:
    jobs:
      - build-wifi-only
