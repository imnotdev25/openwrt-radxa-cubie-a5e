version: 2.1

# Cloud machine executor: resource class "large" (the largest class this plan allows).
# Expect a much slower build than a 16 vCPU machine, and possible out-of-memory failures.
# Disk is the tight limit. The build tree is cut down with:
#   - CONFIG_TARGET_ROOTFS_INITRAMFS=n (skips the 1 GB+ initramfs image)
#   - CONFIG_AUTOREMOVE=y (deletes each package's build_dir after install)
# Free-space check uses 85 GB because df reports slightly less than the 100 GB disk.

parameters:
  rootfs_partsize:
    type: string
    default: "800"

jobs:
  build-full-image:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      PARTSIZE: << pipeline.parameters.rootfs_partsize >>
    steps:
      - checkout
      - run:
          name: Check free disk (need 85 GB)
          command: |
            df -h .
            avail=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
            echo "Free: ${avail} GB"
            [ "$avail" -ge 85 ] || { echo "Not enough disk"; exit 1; }
      - run:
          name: Feeds
          command: |
            ./scripts/feeds update -a
            ./scripts/feeds install -a
      - run:
          name: Seed config
          command: |
            case "$PARTSIZE" in (*[!0-9]*|"") echo "Bad partsize: $PARTSIZE"; exit 1;; esac
            cp configs/full.config .config
            sed -i "s/^CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=$PARTSIZE/" .config
            sed -i "s/^CONFIG_TARGET_ROOTFS_INITRAMFS=.*/# CONFIG_TARGET_ROOTFS_INITRAMFS is not set/" .config
            sed -i "s/^# CONFIG_AUTOREMOVE is not set/CONFIG_AUTOREMOVE=y/; s/^CONFIG_AUTOREMOVE=.*/CONFIG_AUTOREMOVE=y/" .config
            grep -q "^CONFIG_TARGET_ROOTFS_PARTSIZE=$PARTSIZE$" .config || { echo "partsize not applied"; exit 1; }
            grep -q "^CONFIG_AUTOREMOVE=y" .config || { echo "autoremove not applied"; exit 1; }
            make defconfig
      - run:
          name: Build
          command: |
            set -o pipefail
            make -j"$(nproc)" download
            make -j"$(nproc)" V=s 2>&1 | tee build.log
      - run:
          name: Check disk after build
          when: always
          command: df -h .
      - store_artifacts:
          path: bin/targets/sunxi/cortexa55
          destination: image
      - store_artifacts:
          path: build.log

workflows:
  image:
    jobs:
      - build-full-image
