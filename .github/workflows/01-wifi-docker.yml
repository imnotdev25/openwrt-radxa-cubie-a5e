name: 01 Wi-Fi and Docker

on:
  workflow_dispatch:
    inputs:
      rootfs_partsize:
        description: "Root partition size in MB"
        required: true
        default: "16384"

jobs:
  build:
    runs-on: [self-hosted, linux, x64, openwrt-large]
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4

      - name: Check free disk (need 120 GB)
        run: |
          avail=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          echo "Free: ${avail} GB"
          [ "$avail" -ge 120 ] || { echo "Not enough disk"; exit 1; }

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Seed config
        env:
          PARTSIZE: ${{ inputs.rootfs_partsize }}
        run: |
          case "$PARTSIZE" in (*[!0-9]*|"") echo "Bad partsize: $PARTSIZE"; exit 1;; esac
          cp configs/$(basename "$(ls configs/*.diffconfig configs/full.config 2>/dev/null | head -1)") .config
          sed -i "s/^CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=$PARTSIZE/" .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=$PARTSIZE" >> .config
          make defconfig

      - name: Build
        run: |
          set -o pipefail
          make -j"$(nproc)" download
          make -j"$(nproc)" V=s 2>&1 | tee build.log
          echo "BUILD-EXIT=$?"

      - uses: actions/upload-artifact@v4
        with:
          name: wifi-docker-image
          path: |
            bin/targets/sunxi/cortexa55/*-sdcard.img.gz
            build.log
          if-no-files-found: error
