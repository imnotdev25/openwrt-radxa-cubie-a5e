name: 03 Packages zip

on:
  workflow_dispatch:

jobs:
  packages:
    runs-on: [self-hosted, linux, x64, openwrt-large]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - name: Check free disk (need 120 GB)
        run: |
          avail=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          echo "Free: ${avail} GB"
          [ "$avail" -ge 120 ] || { echo "Not enough disk"; exit 1; }

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Seed config (full flagged)
        run: |
          cp configs/full.config .config
          make defconfig

      - name: Build packages
        run: |
          set -o pipefail
          make -j"$(nproc)" download
          make -j"$(nproc)" package/compile V=s 2>&1 | tee build.log
          make package/index

      - name: Zip packages
        run: |
          cd bin/packages/aarch64_cortex-a55
          zip -r "$GITHUB_WORKSPACE/packages-aarch64_cortex-a55.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: packages-zip
          path: |
            packages-aarch64_cortex-a55.zip
            build.log
          if-no-files-found: error
